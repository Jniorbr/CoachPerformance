<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ff">
  <title>Coach — treino e saúde</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <main class="shell">
    <header class="topline">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">✦</div>
        <div><h1>Coach</h1><p>Seu ritmo, sua evolução</p></div>
      </div>
      <div id="session-account" class="privacy" aria-live="polite"></div>
    </header>
    <section id="auth-screen" class="card auth-card" aria-labelledby="auth-title">
      <h2 id="auth-title">Sua conta Coach</h2>
      <p class="subtle">Entre ou crie uma conta para acessar o aplicativo.</p>
      <div class="button-row auth-mode-switch" role="group" aria-label="Tipo de acesso">
        <button id="sign-in-mode" class="button small-button" type="button" aria-pressed="true">Entrar</button>
        <button id="sign-up-mode" class="button button-quiet small-button" type="button" aria-pressed="false">Criar conta</button>
      </div>
      <form id="auth-form">
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required>
        </div>
        <p id="auth-message" class="auth-message" role="status" aria-live="polite"></p>
        <button id="auth-submit" class="button button-wide" type="submit">Entrar</button>
      </form>
    </section>
    <section id="coach-app" hidden>
      <p id="session-message" class="auth-message" role="alert" aria-live="polite"></p>
      <div id="app"></div>
      <p class="footer-note">Séries e refeições são salvas no Supabase; sono, hidratação, cardio e conclusão do treino ficam neste navegador.</p>
    </section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
